[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes-extractor"
version = "2.0.0"
description = "Auditable NHANES public release extraction and validation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "pyreadstat>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
nhanes-extractor = "nhanes_extractor.core:main"

[tool.setuptools.packages.find]
include = ["nhanes_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nhanes_extractor = ["source_exceptions.json"]
